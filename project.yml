name: OpenChamber
options:
  bundleIdPrefix: com.zzw
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  OpenChamber:
    type: application
    platform: iOS
    sources:
      - path: OpenChamber
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzw.openchamber
        PRODUCT_NAME: OpenChamber
        INFOPLIST_FILE: OpenChamber/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

schemes:
  OpenChamber:
    build:
      targets:
        OpenChamber: all
    run:
      config: Release
    archive:
      config: Release
